name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # sigstore attestations (#177): attest-build-provenance требует
  # OIDC id-token и attestations: write для персиста
  id-token: write
  attestations: write

jobs:
  verify-version:
    name: Verify tag matches pyproject version
    # Страховка от рассинхрона: тег v* должен совпадать с
    # [project].version в pyproject.toml — иначе релиз соберётся
    # с другой версией в метаданных пакета, чем в имени релиза
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare tag and pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Тег: $TAG_VERSION, pyproject: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Тег v$TAG_VERSION не совпадает с версией pyproject.toml ($PYPROJECT_VERSION). Используйте scripts/bump_version.py перед пушем тега."
            exit 1
          fi

  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-version
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Upgrade setuptools
        # setuptools из toolcache Python (65.5.0 на windows-latest,
        # 79.0.1 на ubuntu-latest) ловит 9/3 advisories в SBOM-шаге;
        # последний fix — 84.1.0 (GHSA-xmj3-9gf7-h52w)
        run: python -m pip install --upgrade "setuptools>=84.1"

      - name: Install package with dependencies
        # Нужна для SBOM: pip-audit описывает окружение с рантайм-зависимостями
        run: python -m pip install -e . --quiet

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate SBOM (CycloneDX)
        # pip-audit возвращает non-zero при найденных уязвимостях —
        # здесь задача только сгенерировать манифест; аудит делает
        # отдельный Security Audit job в CI (#177)
        continue-on-error: true
        run: |
          # cyclonedx-extra обязателен для --format cyclonedx-json (#177)
          python -m pip install --upgrade "pip-audit[cyclonedx]"
          pip-audit --format cyclonedx-json --output dist/sbom-python.json --skip-editable

      - name: Attest build provenance (sdist and wheel)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-artifacts
          path: dist/*

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    needs: verify-version
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # setuptools из toolcache Python (65.5.0) ловит 9 advisories
          # в SBOM-шаге; последний fix — 84.1.0 (GHSA-xmj3-9gf7-h52w)
          python -m pip install --upgrade "setuptools>=84.1"
          pip install pyinstaller
          pip install -e .

      - name: Build Windows EXE
        run: |
          if (-not (Test-Path "config")) {
            New-Item -ItemType Directory -Path "config" | Out-Null
          }

          pyinstaller --onefile --windowed `
            --name "MIA-ScreenCapture" `
            --icon "docs/assets/MIA-ScreenCapture.ico" `
            --add-data "config;config" `
            --add-data "docs/assets;docs/assets" `
            --hidden-import="PyQt6" `
            --hidden-import="PyQt6.QtCore" `
            --hidden-import="PyQt6.QtWidgets" `
            --hidden-import="PyQt6.QtGui" `
            --hidden-import="pyaudio" `
            --hidden-import="sounddevice" `
            --hidden-import="soundfile" `
            --hidden-import="apscheduler" `
            --hidden-import="apscheduler.schedulers.background" `
            --hidden-import="apscheduler.triggers.cron" `
            --hidden-import="apscheduler.triggers.date" `
            --hidden-import="apscheduler.triggers.interval" `
            --collect-all "windows_capture" `
            main.py

      - name: Smoke test Windows EXE
        shell: pwsh
        run: |
          $apiPort = 5015
          $exePath = Join-Path $PWD "dist/MIA-ScreenCapture.exe"
          $stdoutLog = Join-Path $PWD "dist/smoke-stdout.log"
          $stderrLog = Join-Path $PWD "dist/smoke-stderr.log"
          $proc = Start-Process -FilePath $exePath -ArgumentList @(
            "--headless",
            "--api-host", "127.0.0.1",
            "--api-port", "$apiPort"
          ) -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog

          try {
            $ready = $false
            # 90 попыток x 2s = 180s — свежесобранный (несигнированный) EXE
            # на CI-раннере может ловить задержку из-за антивирусного
            # сканирования при первом запуске; 60s оказалось мало (issue
            # при релизе v1.4.8).
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              if ($proc.HasExited) {
                throw "Smoke test failed: процесс EXE завершился раньше времени (exit code $($proc.ExitCode))."
              }
              try {
                $response = Invoke-RestMethod `
                  -Method Get `
                  -Uri "http://127.0.0.1:$apiPort/health" `
                  -TimeoutSec 2
                # "degraded" принимается как готовность: на CI-раннере
                # нет FFmpeg в PATH, поэтому /health всегда возвращает
                # 200 со status="degraded", никогда "ok" — это ожидаемо
                # для голого раннера и не является сбоем смоук-теста
                # (issue при релизе v1.4.8).
                if ($response.status -in @("ok", "degraded")) {
                  $ready = $true
                  break
                }
              }
              catch {
                # Игнорируем (включая 429 от health-specific rate
                # limit) — основной Start-Sleep ниже общий для обеих
                # веток, чтобы цикл не превращался в busy-loop и сам не
                # выжигал лимит запросов к /health (issue при релизе
                # v1.4.8: отсутствие Start-Sleep на пути "успех, но не
                # ready" приводило к busy-loop и постоянным 429).
              }
              Start-Sleep -Seconds 2
            }

            if (-not $ready) {
              throw "Smoke test failed: /health is unavailable for EXE build."
            }
          }
          finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              Wait-Process -Id $proc.Id -ErrorAction SilentlyContinue
            }
            Write-Host "--- EXE stdout ---"
            if (Test-Path $stdoutLog) { Get-Content $stdoutLog }
            Write-Host "--- EXE stderr ---"
            if (Test-Path $stderrLog) { Get-Content $stderrLog }
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/MIA-ScreenCapture.exe

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" scripts\installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/MIA-ScreenCapture-Setup.exe

      - name: Generate SBOM (CycloneDX)
        # см. комментарий в build-python: аудит — не задача этого шага
        continue-on-error: true
        shell: pwsh
        run: |
          # cyclonedx-extra обязателен для --format cyclonedx-json (#177)
          python -m pip install --upgrade "pip-audit[cyclonedx]"
          pip-audit --format cyclonedx-json --output dist/sbom-windows.json --skip-editable

      - name: Upload Windows SBOM
        uses: actions/upload-artifact@v7
        with:
          name: windows-sbom
          path: dist/sbom-windows.json

      - name: Attest build provenance (EXE)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/MIA-ScreenCapture.exe

      - name: Attest build provenance (Installer)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/MIA-ScreenCapture-Setup.exe

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-python, build-windows]
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-artifacts
          path: dist/python

      - name: Download Windows EXE
        uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: dist/windows

      - name: Download Windows Installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/windows

      - name: Download Windows SBOM
        uses: actions/download-artifact@v8
        with:
          name: windows-sbom
          path: dist/sbom

      - name: Generate SHA256 checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/python/*
            dist/windows/*
            dist/sbom/*
            dist/SHA256SUMS
          generate_release_notes: true
